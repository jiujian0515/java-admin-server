name: Deploy Backend CI/CD

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取最新代码
      - name: 检出新代码
        uses: actions/checkout@v4

      # 2. 安装 JDK 17 并开启 Maven 缓存（加速打包）
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 打包（跳过测试，节省时间）
      - name: Maven 构建打包
        run: mvn clean package -DskipTests

      # 4. 把打好的 jar 包传到服务器
      - name: 上传 Jar 包到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 如果根目录直接是后端代码，路径通常是 target/ruoyi-admin.jar
          # 如果是若依的多模块结构，请确认路径是不是 ruoyi-admin/target/ruoyi-admin.jar
          source: "ruoyi-admin/target/ruoyi-admin.jar"
          target: "${{ secrets.DEPLOY_PATH }}"
          strip_components: 2 # 去掉前面的 target 目录层级

      # 5. 远程执行重启脚本（核心逻辑）
      - name: 重启后端服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # 5.1 停止旧的 Java 进程（只杀包含 java 关键字的进程，防止误杀 SSH 自身）
            echo "正在停止旧的进程..."
            ps -ef | grep ruoyi-admin.jar | grep java | grep -v grep | awk '{print $2}' | xargs -r kill -9
            sleep 2

            # 5.2 启动新的 Jar 包
            echo "正在启动新进程..."
            nohup java -Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -jar ruoyi-admin.jar > ruoyi.log 2>&1 &

            # 5.3 等待并检查日志
            echo "等待服务启动..."
            sleep 8
            tail -n 20 ruoyi.log